[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcc-client"
version = "0.1.0"
description = "Supported Python client SDK for MCC-Core — the canonical governed integration path (Agent → MCC Gateway → decision → execution gate → governed executor)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary — AXLOGIQ Inc." }
authors = [{ name = "AXLOGIQ Inc." }]
keywords = ["mcc-core", "governance", "ai-agents", "execution-gate", "authorization"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/mcc-prior-art/mcc-layer"
Documentation = "https://github.com/mcc-prior-art/mcc-layer/blob/main/sdk/python/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcc_client = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src/mcc_client"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]
