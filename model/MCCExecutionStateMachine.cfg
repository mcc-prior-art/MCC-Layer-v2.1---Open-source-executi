\* PR #71 Workstream I -- small, exhaustively checkable configuration.
\* Two operations sharing a single nonce forces the contention case
\* Inv_NoDoubleNonceConsumption exists to catch; this is deliberately a
\* small bounded instance (see the .tla module docstring for why).

SPECIFICATION Spec

CONSTANTS
    op1 = op1
    op2 = op2
    n1 = n1
    Operations = {op1, op2}
    Nonces = {n1}

INVARIANT Inv_TypeOK
INVARIANT Inv_NoDoubleNonceConsumption
INVARIANT Inv_FailClosedWhileBackendDown
INVARIANT Inv_ExecutedImpliesAuthorizedPath

PROPERTY Prop_TerminalStability
PROPERTY Prop_EventualTermination
