\* PR-5 Workstream I (extension) -- small, exhaustively checkable
\* configuration. Two operations sharing a SINGLE evidence nonce and a
\* SINGLE token nonce each forces both replay-contention cases
\* Inv_NoDoubleEvidenceNonceConsumption / Inv_NoDoubleTokenNonceConsumption
\* exist to catch (mirrors MCCExecutionStateMachine.cfg's identical
\* discipline for opNonce/Nonces). Two distinct EvidenceIds is the minimum
\* needed to exercise Inv_ExecutedImpliesEvidenceMatch's mismatch case at
\* all (with only one possible evidence value, "wrong evidence" would be
\* unreachable and the invariant would hold vacuously).

SPECIFICATION Spec

CONSTANTS
    op1 = op1
    op2 = op2
    evA = evA
    evB = evB
    en1 = en1
    tn1 = tn1
    NoEvidenceVal = NoEvidenceVal
    NoNonceVal = NoNonceVal
    Operations = {op1, op2}
    EvidenceIds = {evA, evB}
    EvidenceNonces = {en1}
    TokenNonces = {tn1}
    NoEvidence = NoEvidenceVal
    NoNonce = NoNonceVal

\* Unlike the companion model (which has an always-enabled ToggleBackend
\* environment action), every operation here reaches a genuine terminal
\* state (EXECUTED or DENIED, or AUTHORIZED-forever-stuck if evidence never
\* matches) with no further action enabled -- this is CORRECT, expected
\* termination, not a bug, so deadlock detection is disabled rather than
\* papering over it with an artificial always-enabled action that would
\* change what is being modeled.
CHECK_DEADLOCK FALSE

INVARIANT Inv_TypeOK
INVARIANT Inv_ExecutedImpliesAuthorized
INVARIANT Inv_ExecutedImpliesEvidenceVerified
INVARIANT Inv_ExecutedImpliesEvidenceMatch
INVARIANT Inv_NoDoubleEvidenceNonceConsumption
INVARIANT Inv_NoDoubleTokenNonceConsumption
