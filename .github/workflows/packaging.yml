name: Packaging & Public API

# Validates the `mcc-core` distribution and the stable `mcc` public facade
# WITHOUT publishing anything (PR #40 + PR #41). It builds sdist+wheel in an
# isolated environment, runs `twine check --strict`, enforces the artifact
# content contract, proves a genuine clean install of the built wheel, checks the
# version contract, and uploads the validated dist/ as an artifact. It never
# requests OIDC and never publishes. Deterministic, no external services, no Docker.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Editable install (mcc-client + mcc-core in one command)
        run: pip install -e ./sdk/python -e ".[dev]"

      - name: Import validation — `from mcc import MCCClient`
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata as im
          import mcc, mcc_client
          from mcc import MCCClient, Verdict, Decision, MCCError  # noqa: F401
          assert MCCClient is mcc_client.MCCClient, "facade must re-export the same class"
          assert Verdict is mcc_client.Verdict
          assert mcc.client_version == mcc_client.__version__
          assert mcc.__version__ == im.version("mcc-core"), "runtime != metadata version"
          print("import OK:", mcc.__version__, "| client", mcc.client_version)
          PY

      - name: Facade + version + release-guard contract tests
        run: pytest tests/test_mcc_facade.py tests/test_version_contract.py tests/test_release_guard.py -v

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned build + validation tooling
        run: pip install "build~=1.2" "twine>=5.1" "packaging>=24.2"

      - name: Build sdist + wheel in an isolated environment
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build --outdir dist

      - name: Exactly one sdist and one wheel
        run: |
          set -euo pipefail
          test "$(ls dist/*.whl | wc -l)" = "1"
          test "$(ls dist/*.tar.gz | wc -l)" = "1"

      - name: twine check --strict
        run: twine check --strict dist/*

      - name: Artifact content contract (wheel + sdist)
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import glob; from scripts.release_checks import wheel_filename_version as v; print(v(glob.glob("dist/*.whl")[0]))')"
          echo "authoritative version: $VERSION"
          python -m scripts.release_checks inspect-wheel "$(ls dist/*.whl)" --version "$VERSION"
          python -m scripts.release_checks inspect-sdist "$(ls dist/*.tar.gz)" --version "$VERSION"

      - name: Genuine clean install of the built wheel (outside the checkout)
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install "$(ls dist/*.whl)" ./sdk/python
          cd /tmp
          /tmp/v/bin/python - <<'PY'
          import importlib.metadata as im, pathlib, mcc, mcc_client
          mf = pathlib.Path(mcc.__file__).resolve()
          assert "/tmp/v/" in str(mf), f"mcc not imported from the venv: {mf}"
          from mcc import MCCClient
          from mcc_client import MCCClient as Orig
          assert MCCClient is Orig, "facade must re-export the identical class"
          assert mcc.__version__ == im.version("mcc-core"), "runtime != metadata"
          print("CLEAN-INSTALL OK", mcc.__version__, mf)
          PY

      - name: Built-artifact + clean-install pytest contract
        run: pip install -e ./sdk/python && pytest tests/test_artifact_contract.py -v

      - name: Upload validated distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcc-core-dist
          path: dist/*
          if-no-files-found: error
