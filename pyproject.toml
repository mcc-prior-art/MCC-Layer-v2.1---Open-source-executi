# Root distribution for MCC-Core: `mcc-core`.
#
# This packages ONLY the thin, stable public facade `mcc` (see mcc/__init__.py),
# which re-exports the supported `mcc_client` SDK unchanged. It deliberately does
# NOT vendor or duplicate `mcc_client`, the gateway, the runtime, or any
# governance logic — `mcc-core` depends on `mcc-client`, which remains its own
# independently-installable distribution under sdk/python/.
#
# Install (end users, once published):   pip install mcc-core
# Install (this monorepo, editable):      pip install -e ./sdk/python -e .
#   (the second `-e .` alone also works once `mcc-client` is already installed)

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcc-core"
# Single-source version: the authoritative string lives in mcc/_version.py and
# the metadata is generated from that attribute (see [tool.setuptools.dynamic]).
# This keeps mcc.__version__ == importlib.metadata.version("mcc-core").
dynamic = ["version"]
description = "MCC-Core — execution governance for autonomous AI systems. Stable public `mcc` facade over the supported mcc-client SDK (Agent → MCC Gateway → decision → execution gate → governed executor → audit)."
readme = "docs/PACKAGING_AND_SDK.md"
requires-python = ">=3.9"
license = { text = "Proprietary — AXLOGIQ Inc." }
authors = [{ name = "AXLOGIQ Inc." }]
keywords = ["mcc-core", "governance", "ai-agents", "execution-gate", "authorization", "audit"]
dependencies = [
    # The facade re-exports this supported client; no governance logic is
    # duplicated here. Pinned to the 0.1.x line it was validated against.
    "mcc-client>=0.1,<0.2",
    # Required by the bundled Adapter SDK / Canonical Protocol import path (PR #50):
    # `mcc_core.signing` (canonical hashing) imports cryptography, and
    # `mcc_protocol.observability` uses prometheus-client for bounded metrics. These
    # are the SDK's runtime needs — no governance engine is shipped or pulled in.
    "cryptography>=42",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
# Running the MCC Gateway service locally (the governance authority). Justified:
# `from mcc import MCCClient` talks to a gateway; these run one.
gateway = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "build>=1.2",
]
# Release engineering: build + validate distributions (never publishing creds).
# packaging>=24.2 recognizes Metadata 2.4 License-File so `twine check --strict`
# accepts the built wheel's license metadata.
release = [
    "build>=1.2",
    "twine>=5.1",
    "packaging>=24.2",
]

[project.urls]
Homepage = "https://github.com/mcc-prior-art/mcc-layer"
Documentation = "https://github.com/mcc-prior-art/mcc-layer/blob/main/docs/PACKAGING_AND_SDK.md"

# Distribution contents (PR #50).
#
# The wheel carries the stable public facade `mcc` plus the public Adapter SDK
# (`mcc_adapter_sdk`) and the Canonical Governance Protocol it is a façade over
# (`mcc_protocol`). Those two import only *pure* primitives from `mcc_core`
# (canonical hashing) and `mcc_compliance` (the capability vocabulary), so a
# **governance-free** subset of each is included — the execution gate, authority,
# consensus, coordinator, audit, and the compliance runner/suite are deliberately
# excluded from the built distribution (see `setup.py`'s `build_py`: it ships only
# the pure modules the SDK/protocol import path needs). `mcc_client` remains its own
# dependency distribution and is never vendored here.
[tool.setuptools]
packages = ["mcc", "mcc_adapter_sdk", "mcc_protocol", "mcc_core", "mcc_compliance"]

[tool.setuptools.package-dir]
mcc_adapter_sdk = "src/mcc_adapter_sdk"
mcc_protocol = "src/mcc_protocol"
mcc_core = "src/mcc_core"
mcc_compliance = "src/mcc_compliance"

[tool.setuptools.dynamic]
version = { attr = "mcc._version.__version__" }

[tool.setuptools.package-data]
mcc = ["py.typed"]
mcc_adapter_sdk = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["mcc"]
# The facade re-exports the typed `mcc_client` (src layout under sdk/python).
# Point mypy at it so strict resolution finds its py.typed types.
mypy_path = "sdk/python/src"

# `mcc_client` is a dependency with its own type-check gate; this package's mypy
# run validates the facade against its types but does not re-audit (and report)
# the dependency's own internals.
[[tool.mypy.overrides]]
module = "mcc_client.*"
follow_imports = "silent"

[tool.ruff]
line-length = 100
target-version = "py39"
